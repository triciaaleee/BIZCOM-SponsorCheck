<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in, SponsorCheck Admin</title>
  <link rel="icon" href="assets/favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components/buttons.css">
  <link rel="stylesheet" href="../css/components/forms.css">
  <link rel="stylesheet" href="../css/components/cards.css">
  <link rel="stylesheet" href="../css/components/admin-shell.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>

<div class="login-shell">

  <div class="demo-banner">
    <i class="bi bi-cone-striped"></i>
    <span><strong>Demo mode.</strong> Mock authentication. Any password works. Use <code>biz@sa.smu.edu.sg</code> for super-admin or any <code>*.sa.smu.edu.sg</code> email for admin.</span>
  </div>

  <main class="login-page">
    <div class="login-card">
      <div class="login-card__brand">
        <img src="assets/bizcom-logo.png" alt="SMU BIZCOM">
      </div>
      <h1 class="login-card__title">Admin sign in</h1>
      <p class="login-card__sub">SponsorCheck control panel.</p>

      <div class="login-card__error" id="login-error" role="alert"></div>

      <form class="login-card__form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" class="form-input" id="login-email" placeholder="biz@sa.smu.edu.sg" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="Mock auth, any value works" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--primary btn--lg" style="width: 100%">
          <i class="bi bi-shield-lock-fill"></i> Sign in
        </button>
      </form>

      <div class="login-card__footer">
        Need access? Email <a href="mailto:biz@sa.smu.edu.sg">biz@sa.smu.edu.sg</a>
      </div>
    </div>
  </main>

</div>

<script src="../js/lib/mock-data.js" defer></script>
<script src="../js/admin/admin-shell.js" defer></script>
<script src="../js/admin/login-page.js" defer></script>
</body>
</html>
