<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in — BIZCOM SponsorCheck</title>
  <link rel="icon" href="assets/favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">

  <link rel="stylesheet" href="../css/components/buttons.css">
  <link rel="stylesheet" href="../css/components/forms.css">
  <link rel="stylesheet" href="../css/components/cards.css">
  <link rel="stylesheet" href="../css/components/toasts.css">

  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>

<div class="page">

  <nav class="navbar">
    <div class="navbar__container">
      <a href="../index.html" class="navbar__brand">
        <span class="navbar__brand-mark"><span>bi</span><span>z</span><span>com</span></span>
        <span class="navbar__brand-sub">SponsorCheck</span>
      </a>
      <div class="navbar__nav">
        <a href="../sponsor-check.html" class="navbar__link">Back to public site</a>
      </div>
    </div>
  </nav>

  <main class="page__main">
    <div class="login">
      <div class="login__card">
        <div class="login__brand">
          <div class="login__brand-mark">bi<span class="accent">z</span>com</div>
          <div class="login__brand-sub">Admin Console</div>
        </div>

        <h1 class="login__title">Sign in to continue</h1>

        <form id="login-form" autocomplete="off" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="biz.secretary@sa.smu.edu.sg" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn--primary" style="width: 100%; margin-top: var(--space-3)">
            <i class="bi bi-box-arrow-in-right"></i> Sign in
          </button>

          <div class="login__footer">
            <a href="#" onclick="event.preventDefault(); toast({type:'info', title:'Reset link sent', message:'(Demo only — backend not wired up.)'})">Forgot password?</a>
          </div>
        </form>

        <hr style="margin: var(--space-5) 0">

        <p class="text-xs text-muted text-center" style="margin: 0">
          This page is a frontend prototype. Authentication will be wired to Supabase Auth in Phase 1.
          <br>Use any email + password to enter the demo admin area.
        </p>
      </div>
    </div>
  </main>
</div>

<script src="../js/components/toast.js" defer></script>
<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.classList.add('is-loading');
    btn.disabled = true;
    setTimeout(function () {
      window.location.href = './index.html';
    }, 700);
  });
</script>
</body>
</html>
