<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sponsor, SponsorCheck Admin</title>
  <link rel="icon" href="assets/favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components/buttons.css">
  <link rel="stylesheet" href="../css/components/forms.css">
  <link rel="stylesheet" href="../css/components/pills.css">
  <link rel="stylesheet" href="../css/components/admin-shell.css">
  <link rel="stylesheet" href="../css/components/admin-meta.css">
  <link rel="stylesheet" href="../css/components/toasts.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>

<main class="admin-main">

  <a href="sponsors.html" class="sponsor-detail__back">
    <i class="bi bi-arrow-left"></i> Back to sponsors
  </a>

  <div class="sponsor-detail">

    <div class="sponsor-detail__main">
      <h2 class="sponsor-detail__heading" id="sponsor-form-heading">Sponsor</h2>

      <form id="sponsor-form">
        <div class="form-group">
          <label class="form-label" for="sp-name">Company name <span class="form-label__required">*</span></label>
          <input type="text" class="form-input" id="sp-name" placeholder="e.g. Razer" required>
        </div>

        <div class="form-group">
          <label class="form-label">Status <span class="form-label__required">*</span></label>
          <div class="status-picker" role="radiogroup" aria-label="Sponsor status">
            <button type="button" class="status-picker__tile is-active" data-status="approved" role="radio" aria-checked="true">
              <i class="bi bi-check-circle-fill"></i>
              <span>Approved</span>
            </button>
            <button type="button" class="status-picker__tile" data-status="prohibited" role="radio" aria-checked="false">
              <i class="bi bi-x-circle-fill"></i>
              <span>Prohibited</span>
            </button>
            <button type="button" class="status-picker__tile" data-status="closed" role="radio" aria-checked="false">
              <i class="bi bi-slash-circle-fill"></i>
              <span>Closed</span>
            </button>
            <button type="button" class="status-picker__tile" data-status="alumni" role="radio" aria-checked="false">
              <i class="bi bi-mortarboard-fill"></i>
              <span>Alumni</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="sp-industry">Industry <span class="form-label__required">*</span></label>
          <select class="form-input" id="sp-industry" required></select>
        </div>

        <!-- Status-specific fields -->
        <div class="form-group" id="grp-annex-category" style="display: none">
          <label class="form-label" for="sp-annex-category">Annex category <span class="form-label__required">*</span></label>
          <select class="form-input" id="sp-annex-category"></select>
          <div class="form-helper">
            Annex A companies cannot be approached and clubs must remove them.
            Annex B companies stay on a club's list for BIZCOM to decide.
          </div>
        </div>

        <!-- Only BIZCOM Partner is time-boxed; every other annex category is
             permanent, so this field appears for that category alone. -->
        <div class="form-group" id="grp-contract-ends" style="display: none">
          <label class="form-label" for="sp-contract-ends">Contract end date <span class="form-label__required">*</span></label>
          <input type="date" class="form-input" id="sp-contract-ends">
          <div class="form-helper">Restricted under Annex B until this date, then automatically flagged to clear.</div>
        </div>

        <!-- One notes field for every status. The label and placeholder change
             with the status; the column behind it does not. -->
        <div class="form-group" id="grp-notes">
          <label class="form-label" for="sp-notes" id="sp-notes-label">Notes <span class="form-label__optional">optional</span></label>
          <textarea class="form-input" id="sp-notes" rows="3" placeholder="Any context for BIZCOM, e.g. previous events..."></textarea>
        </div>

        <div class="sponsor-detail__form-actions">
          <a href="sponsors.html" class="btn btn--secondary btn--sm">Cancel</a>
          <button type="submit" class="btn btn--primary btn--sm" id="sp-save">
            <i class="bi bi-check-lg"></i> Save changes
          </button>
        </div>
      </form>

      <div class="sponsor-detail__danger" id="danger-zone" style="display: none">
        <button type="button" class="sponsor-detail__danger-link" id="sp-delete">
          <i class="bi bi-trash"></i> Delete sponsor
        </button>
      </div>
    </div>

    <aside class="sponsor-detail__side" id="sponsor-side">
      <div class="sponsor-detail__heading" style="font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: var(--letter-spacing-wide); color: var(--text-muted);">Metadata</div>
      <ul class="meta-list" id="meta-list">
        <li><span class="meta-list__key">ID</span><span class="meta-list__val" id="meta-id">-</span></li>
        <li><span class="meta-list__key">Outreach</span><span class="meta-list__val" id="meta-outreach">-</span></li>
        <li id="meta-cooldown-row" hidden><span class="meta-list__key">Cooldown</span><span class="meta-list__val" id="meta-cooldown">-</span></li>
      </ul>
    </aside>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../js/lib/supabase-config.js" defer></script>
<script src="../js/lib/supabase-client.js" defer></script>
<script src="../js/admin/admin-api.js" defer></script>
<script src="../js/lib/matcher-core.js" defer></script>
<script src="../js/components/toast.js" defer></script>
<script src="../js/admin/admin-shell.js" defer></script>
<script src="../js/admin/sponsor-page.js" defer></script>
</body>
</html>
