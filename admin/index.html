<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SponsorCheck Admin</title>
  <meta http-equiv="refresh" content="0; url=login.html">
  <link rel="icon" href="assets/favicon.png">
</head>
<body>
  <p>Redirecting to <a href="login.html">sign-in</a>...</p>
  <script>
    (function () {
      try {
        var raw = sessionStorage.getItem('sponsorcheck_admin_session');
        if (raw) {
          var s = JSON.parse(raw);
          if (s && s.email && s.role) {
            window.location.replace('sponsors.html');
            return;
          }
        }
      } catch (e) {}
      window.location.replace('login.html');
    })();
  </script>
</body>
</html>
