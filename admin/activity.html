<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity, SponsorCheck Admin</title>
  <link rel="icon" href="assets/favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components/buttons.css">
  <link rel="stylesheet" href="../css/components/pills.css">
  <link rel="stylesheet" href="../css/components/states.css">
  <link rel="stylesheet" href="../css/components/tables.css">
  <link rel="stylesheet" href="../css/components/admin-shell.css">
  <link rel="stylesheet" href="../css/components/admin-meta.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>

<main class="admin-main">

  <div class="page-filters">
    <select class="form-input" id="filter-actor" aria-label="Filter by admin">
      <option value="all">All admins</option>
    </select>

    <select class="form-input" id="filter-action" aria-label="Filter by action type">
      <option value="all">All actions</option>
      <option value="sponsor.created">Sponsor created</option>
      <option value="sponsor.updated">Sponsor updated</option>
      <option value="sponsor.status_changed">Sponsor status change</option>
      <option value="sponsor.deleted">Sponsor deleted</option>
      <option value="submission.received">Submission received</option>
      <option value="submission.status_changed">Submission status change</option>
      <option value="submission.updated">Submission updated</option>
      <option value="submission.viewed">Submission viewed</option>
      <option value="admin.added">Admin added</option>
    </select>

    <div style="flex: 1"></div>

    <span class="text-secondary text-sm">
      <strong id="activity-count">0</strong> entries
    </span>
  </div>

  <div class="admin-table-wrap">
    <table class="admin-table" id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Who</th>
          <th>What</th>
        </tr>
      </thead>
      <tbody id="activity-tbody"></tbody>
    </table>
    <div class="empty-card" id="activity-empty" style="display: none">
      <i class="bi bi-clock-history"></i>
      <div class="empty-card__title">No activity yet</div>
      <div class="empty-card__sub">Admin actions will appear here.</div>
    </div>
  </div>

</main>

<script src="../js/lib/mock-data.js" defer></script>
<script src="../js/admin/admin-shell.js" defer></script>
<script src="../js/admin/activity-page.js" defer></script>
</body>
</html>
