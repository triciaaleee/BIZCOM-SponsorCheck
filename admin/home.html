<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home, SponsorCheck Admin</title>
  <link rel="icon" href="assets/favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components/buttons.css">
  <link rel="stylesheet" href="../css/components/forms.css">
  <link rel="stylesheet" href="../css/components/pills.css">
  <link rel="stylesheet" href="../css/components/states.css">
  <link rel="stylesheet" href="../css/components/tables.css">
  <link rel="stylesheet" href="../css/components/admin-shell.css">
  <link rel="stylesheet" href="../css/components/side-panel.css">
  <link rel="stylesheet" href="../css/components/admin-meta.css">
  <link rel="stylesheet" href="../css/components/toasts.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>

<main class="admin-main admin-main--wide">

  <section class="welcome-card" id="welcome-card">
    <div class="welcome-card__greeting">
      <h2 class="welcome-card__hello">
        Hi, <span class="welcome-card__name" id="welcome-name">there</span>.
      </h2>
      <p class="welcome-card__sub">Here's your queue at a glance.</p>
    </div>
    <div class="pending" id="pending">
      <div class="pending__head">
        <span class="pending__title">Pending</span>
        <span class="pending__count" id="pending-count">0 to finish</span>
      </div>
      <ul class="pending__list" id="pending-list"></ul>
      <div class="pending__empty" id="pending-empty" hidden>All caught up — no pending submissions.</div>
    </div>
  </section>

  <section class="calendar" id="calendar" aria-label="Submissions by month">
    <div class="calendar__toolbar">
      <div class="calendar__nav">
        <button type="button" class="calendar__nav-btn" id="cal-prev" aria-label="Previous year">
          <i class="bi bi-chevron-left"></i>
        </button>
        <h2 class="calendar__year" id="cal-year">2026</h2>
        <button type="button" class="calendar__nav-btn" id="cal-next" aria-label="Next year">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
      <div class="calendar__legend" aria-label="Status colour key">
        <span class="calendar__legend-item"><span class="calendar__legend-dot calendar__legend-dot--new"></span> New</span>
        <span class="calendar__legend-item"><span class="calendar__legend-dot calendar__legend-dot--reviewing"></span> Reviewing</span>
        <span class="calendar__legend-item"><span class="calendar__legend-dot calendar__legend-dot--completed"></span> Completed</span>
      </div>
    </div>
    <div class="calendar__grid" id="calendar-grid"></div>
  </section>

</main>

<!-- Side panel + backdrop: create / edit a submission -->
<div class="side-panel-backdrop" id="panel-backdrop"></div>
<aside class="side-panel" id="side-panel" aria-hidden="true" inert aria-labelledby="panel-title">
  <header class="side-panel__header">
    <div>
      <h2 class="side-panel__title" id="panel-title">Submission</h2>
      <div class="side-panel__sub" id="panel-sub"></div>
    </div>
    <button class="side-panel__close" id="panel-close" aria-label="Close panel">
      <i class="bi bi-x"></i>
    </button>
  </header>

  <div class="side-panel__body">
    <div class="side-panel__section">
      <div class="side-panel__section-title">Status</div>
      <div class="panel-status-picker" role="radiogroup" aria-label="Submission status">
        <button type="button" class="panel-status-picker__tile" data-panel-status="new" role="radio" aria-checked="false">New</button>
        <button type="button" class="panel-status-picker__tile" data-panel-status="reviewing" role="radio" aria-checked="false">Reviewing</button>
        <button type="button" class="panel-status-picker__tile" data-panel-status="completed" role="radio" aria-checked="false">Completed</button>
      </div>
      <ul class="meta-list" id="panel-submitted-line" style="margin-top: var(--space-4)">
        <li><span class="meta-list__key">Submitted</span><span class="meta-list__val" id="panel-submitted">-</span></li>
      </ul>
    </div>

    <div class="side-panel__section">
      <div class="side-panel__section-title">Event details</div>
      <div class="form-group">
        <label class="form-label" for="panel-event-input">Event name <span class="form-label__required">*</span></label>
        <input type="text" class="form-input" id="panel-event-input">
      </div>
      <div class="form-group">
        <label class="form-label" for="panel-club-input">Club <span class="form-label__required">*</span></label>
        <input type="text" class="form-input" id="panel-club-input">
      </div>
      <div class="form-group">
        <label class="form-label" for="panel-size-input">Event size</label>
        <select class="form-input" id="panel-size-input">
          <option value="small" selected>Small (&lt;50)</option>
          <option value="medium">Medium (50-150)</option>
          <option value="large">Large (&gt;150)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="panel-complete-by-input">Complete by <span class="form-label__required">*</span></label>
        <input type="date" class="form-input" id="panel-complete-by-input">
      </div>
    </div>

    <!-- Derived from the lists recorded on Vet & Upload — never typed in here. -->
    <!-- Hidden while creating: a submission that does not exist yet has no
         waves and no contacts, so the meter would only ever read 0. -->
    <div class="side-panel__section" id="panel-cap-section">
      <div class="side-panel__section-title">Sponsor Cap</div>
      <div class="sub-cap">
        <div class="sub-cap__head">
          <span class="sub-cap__count" id="panel-cap-count">0 / 0</span>
          <span class="sub-cap__waves" id="panel-cap-waves">No waves yet</span>
        </div>
        <div class="sub-cap__meter"><span class="sub-cap__bar" id="panel-cap-bar"></span></div>
        <ul class="wave-list" id="panel-wave-list"></ul>
      </div>
    </div>
  </div>

  <footer class="side-panel__footer">
    <!-- Edit mode only; hidden while creating. Pushed left, away from Save. -->
    <button type="button" class="btn btn--tertiary btn--sm side-panel__footer-danger" id="panel-delete" hidden>
      <i class="bi bi-trash"></i> Delete
    </button>
    <!-- Edit mode only: jumps to Vet & Upload with this submission attached. -->
    <button type="button" class="btn btn--secondary btn--sm" id="panel-vet" hidden>
      <i class="bi bi-clipboard-check"></i> Vet a list
    </button>
    <button type="button" class="btn btn--secondary btn--sm" id="panel-cancel">Close</button>
    <button type="button" class="btn btn--primary btn--sm" id="panel-save">
      <i class="bi bi-check-lg"></i> <span id="panel-save-label">Save</span>
    </button>
  </footer>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../js/lib/supabase-config.js" defer></script>
<script src="../js/lib/supabase-client.js" defer></script>
<script src="../js/admin/admin-api.js" defer></script>
<script src="../js/components/toast.js" defer></script>
<script src="../js/admin/admin-shell.js" defer></script>
<script src="../js/admin/home-page.js" defer></script>
</body>
</html>
